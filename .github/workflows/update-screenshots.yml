name: Update Screenshots
# Run manually on a PR branch ("Run workflow", pick the branch) to regenerate
# the Playwright screenshot baselines in tests/screenshots/ and commit them
on:
  workflow_dispatch:

permissions:
  contents: write
  # Pushes made with GITHUB_TOKEN don't trigger workflows, so CI is started
  # explicitly via workflow_dispatch after the push
  actions: write

jobs:
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

  update:
    needs: playwright-version
    if: github.ref_name != 'main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Same image as the CI playwright job, so the baselines match
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Update screenshots
        run: npx playwright test tests/pages.spec.ts --update-snapshots
      - name: Commit and push changed screenshots
        id: commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add tests/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes" >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update screenshot baselines"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # Separate job: the Playwright image has no gh CLI
  run-ci:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run CI on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
